name: Build public iOS candidate

on:
  workflow_dispatch:
    inputs:
      startup_ui:
        description: Test the sign-in screen with the simulator-only configuration
        type: boolean
        default: false
      matrix_probe:
        description: Run the isolated Synapse preflight
        type: choice
        options: ['off', server]
        default: 'off'

permissions: {}

jobs:
  simulator-build:
    # Fail closed on missing visibility, and avoid metered private-repository minutes.
    if: ${{ toJSON(github.event.repository.private) == 'false' }}
    runs-on: xcode-27
    timeout-minutes: 80
    env:
      CANDIDATE_REVISION: f4a48300ef7d86036b2cbf712792ab2bb0ca4f52
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      SIMULATOR_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=27.0,arch=arm64
    defaults:
      run:
        shell: bash

    steps:
      - name: Select Python for the owned Matrix fixture
        if: ${{ inputs.matrix_probe != 'off' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'

      - name: Build pinned Synapse and verify the loopback fixture
        if: ${{ inputs.matrix_probe != 'off' }}
        env:
          CARGO_BUILD_JOBS: 2
          PIP_DISABLE_PIP_VERSION_CHECK: 1
        run: |
          fixtures="$RUNNER_TEMP/public-matrix-fixture"
          git init "$fixtures"
          git -C "$fixtures" fetch --no-tags --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git -C "$fixtures" checkout --detach FETCH_HEAD
          test "$(git -C "$fixtures" rev-parse HEAD)" = "$GITHUB_SHA"
          archive="$RUNNER_TEMP/matrix_synapse-1.165.0.tar.gz"
          curl -fsSL --retry 2 --max-time 120 -o "$archive" \
            https://files.pythonhosted.org/packages/29/a7/df38048c4226c43503bf99841972009e002591d3eefe50f6ae7f812d080f/matrix_synapse-1.165.0.tar.gz
          printf '%s  %s\n' 3ea0ce402ecca0b85460ce1bd0b98652bfe0b5bcf701452b763395eaf48319bc "$archive" \
            | shasum -a 256 -c -
          python -m venv "$RUNNER_TEMP/synapse-venv"
          python="$RUNNER_TEMP/synapse-venv/bin/python"
          "$python" -m pip install --no-cache-dir "$archive"
          "$python" "$fixtures/fixtures/matrix/fixture.py" --directory "$RUNNER_TEMP/matrix-preflight"

      - name: Verify Xcode and install build tools
        if: ${{ inputs.matrix_probe != 'server' }}
        run: |
          xcodebuild -version
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = 27.0
          unset HOMEBREW_NO_INSTALL_FROM_API
          export HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1
          brew install xcodegen swiftlint swiftformat pkl
          xcodegen --version
          git lfs version

      - name: Download pinned public candidate
        if: ${{ inputs.matrix_probe != 'server' }}
        working-directory: ${{ runner.temp }}
        run: |
          git init public-ios-candidate
          cd public-ios-candidate
          git lfs install --local --skip-repo
          git remote add origin https://github.com/element-hq/element-x-ios.git
          git fetch --no-tags --depth=1 origin "$CANDIDATE_REVISION"
          GIT_LFS_SKIP_SMUDGE=1 git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$CANDIDATE_REVISION"
          # The Debug app references these media assets. Snapshot fixtures belong to test schemes.
          git lfs pull --include='Components/DevelopmentAssets/Media/**' --exclude=''

      - name: Prepare isolated startup configuration and UI test
        if: ${{ inputs.startup_ui && inputs.matrix_probe == 'off' }}
        working-directory: ${{ runner.temp }}/public-ios-candidate
        run: |
          unset SENTRY_DSN SENTRY_RUST_DSN POSTHOG_HOST POSTHOG_API_KEY RAGESHAKE_URL MAPLIBRE_API_KEY
          pkl eval -o Components/Secrets/Secrets.swift Components/Secrets/Secrets.pkl
          for key in sentryDSN sentryRustDSN postHogHost postHogAPIKey rageshakeURL mapLibreAPIKey; do
            grep -Eq "static let $key: String\\? = nil[[:space:]]*$" Components/Secrets/Secrets.swift
          done

          cat > UITests/Sources/PublicCandidateStartupTests.swift <<'SWIFT'
          import XCTest

          @MainActor
          final class PublicCandidateStartupTests: XCTestCase {
              func testSimplifiedChineseAndArabicStartup() {
                  continueAfterFailure = false
                  let chinese = startupOffset(language: "zh-Hans", region: "zh_CN",
                                              signIn: "手动登录", qr: "使用二维码登录",
                                              developerOptions: "开发者选项")
                  XCTAssertGreaterThan(chinese, 4, "Developer button should be right of the version in LTR.")

                  let arabic = startupOffset(language: "ar", region: "ar_SA",
                                              signIn: "تسجيل الدخول يدوياً",
                                              qr: "تسجيل الدخول باستخدام رمز QR",
                                              developerOptions: "خيارات المطوِّرين")
                  XCTAssertLessThan(arabic, -4, "Developer button should be left of the version in RTL.")
              }

              private func startupOffset(language: String, region: String, signIn: String,
                                         qr: String, developerOptions: String) -> CGFloat {
                  let app = XCUIApplication()
                  app.launchArguments = ["-AppleLanguages", "(\(language))", "-AppleLocale", region]
                  app.launch()
                  defer { app.terminate() }

                  let identifiers = A11yIdentifiers.authenticationStartScreen
                  let signInButton = app.buttons[identifiers.signIn]
                  XCTAssertTrue(signInButton.waitForExistence(timeout: 30))
                  XCTAssertTrue(signInButton.isHittable)
                  XCTAssertEqual(signInButton.label, signIn)
                  let qrButton = app.buttons[identifiers.signInWithQr]
                  XCTAssertTrue(qrButton.isHittable)
                  XCTAssertEqual(qrButton.label, qr)

                  let version = app.staticTexts[identifiers.appVersion]
                  let developerButton = app.buttons[developerOptions]
                  XCTAssertTrue(version.isHittable)
                  XCTAssertTrue(developerButton.exists)
                  let delta = developerButton.frame.midX - version.frame.midX

                  let englishHeadline = app.staticTexts["Be in your element"].exists
                  let observation = "STARTUP_UI language=\(language) offset=\(delta) englishHeadline=\(englishHeadline)"
                  XCTContext.runActivity(named: observation) { activity in
                      let attachment = XCTAttachment(screenshot: app.screenshot())
                      attachment.name = "startup-\(language)"
                      attachment.lifetime = .keepAlways
                      activity.add(attachment)
                  }
                  return delta
              }
          }
          SWIFT

      - name: Build Debug app and extensions for the iOS simulator
        if: ${{ inputs.matrix_probe != 'server' }}
        working-directory: ${{ runner.temp }}/public-ios-candidate
        env:
          STARTUP_UI: ${{ inputs.startup_ui }}
        run: |
          xcodegen generate
          if [[ "$STARTUP_UI" == true ]]; then
            entitlements=ElementX/SupportingFiles/ElementX.entitlements
            /usr/libexec/PlistBuddy -c 'Delete :aps-environment' "$entitlements"
            /usr/libexec/PlistBuddy -c 'Delete :com.apple.developer.associated-domains' "$entitlements"
          fi
          xcodebuild build \
            -project ElementX.xcodeproj \
            -scheme ElementX \
            -configuration Debug \
            -destination "$SIMULATOR_DESTINATION" \
            -onlyUsePackageVersionsFromResolvedFile \
            -derivedDataPath "$RUNNER_TEMP/ios-candidate-build"
          git diff --exit-code HEAD -- ElementX.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Verify simulator product and both extensions
        if: ${{ inputs.matrix_probe != 'server' }}
        run: |
          app="$RUNNER_TEMP/ios-candidate-build/Build/Products/Debug-iphonesimulator/ElementX.app"
          for bundle in "$app" "$app/PlugIns/NSE.appex" "$app/PlugIns/ShareExtension.appex"; do
            platform=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$bundle/Info.plist")
            test "$platform" = iPhoneSimulator
            executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle/Info.plist")
            xcrun lipo -verify_arch arm64 "$bundle/$executable"
            printf 'Verified arm64 simulator product: %s\n' "${bundle##*/}"
          done
          printf 'Candidate source revision: %s\n' "$CANDIDATE_REVISION"

      - name: Check installed app startup in Simplified Chinese and Arabic
        if: ${{ inputs.startup_ui && inputs.matrix_probe == 'off' }}
        working-directory: ${{ runner.temp }}/public-ios-candidate
        run: |
          app="$RUNNER_TEMP/ios-candidate-build/Build/Products/Debug-iphonesimulator/ElementX.app"
          signed_entitlements="$RUNNER_TEMP/ios-startup-entitlements.plist"
          codesign -d --entitlements :- "$app" > "$signed_entitlements"
          plutil -lint "$signed_entitlements"
          for key in aps-environment com.apple.developer.associated-domains; do
            if /usr/libexec/PlistBuddy -c "Print :$key" "$signed_entitlements" >/dev/null 2>&1; then
              printf 'Startup app unexpectedly has entitlement: %s\n' "$key" >&2
              exit 1
            fi
          done
          xcodebuild test \
            -project ElementX.xcodeproj \
            -scheme UITests \
            -configuration Debug \
            -destination "$SIMULATOR_DESTINATION" \
            -onlyUsePackageVersionsFromResolvedFile \
            -derivedDataPath "$RUNNER_TEMP/ios-candidate-build" \
            -resultBundlePath "$RUNNER_TEMP/ios-startup.xcresult" \
            -parallel-testing-enabled NO \
            -enableCodeCoverage NO \
            -only-testing:UITests/PublicCandidateStartupTests/testSimplifiedChineseAndArabicStartup
          git diff --exit-code HEAD -- ElementX.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
